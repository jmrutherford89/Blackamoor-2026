<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Finish Recorder</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="finish">
  <main class="screen">
    <section class="topbar">
      <a href="/index.html">← Menu</a>
      <span id="sync-status">Ready</span>
    </section>
    <section class="card input-card">
      <p class="eyebrow">Finish recorder</p>
      <h1>Enter bibs in finish order</h1>
      <div class="display" id="display">&nbsp;</div>
      <div class="keypad" id="keypad"></div>
      <button class="submit-button orange" id="submit-button">ASSIGN</button>
      <p class="status-message" id="message">Enter bib number</p>
    </section>
    <section class="card recent-card">
      <h2>Recent assigned bibs</h2>
      <div id="recent-list" class="recent-list"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
